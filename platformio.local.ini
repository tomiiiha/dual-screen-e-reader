[env:custom_reader]
extends = base

board = esp32-s3-devkitc-1
board_build.mcu = esp32s3
board_build.arduino.memory_type = dio_opi

board_build.flash_size = 8MB
board_upload.flash_size = 8MB
board_upload.maximum_size = 6553600
board_build.partitions = partitions_custom_reader.csv

build_unflags =
    -DARDUINO_USB_CDC_ON_BOOT=1

build_flags =
    ${base.build_flags}
    -DFREEINK_DEVICE_CUSTOM_READER=1
    -DBOARD_HAS_PSRAM
    -DCROSSPOINT_VERSION=\"${crosspoint.version}-custom_reader\"
    -DENABLE_SERIAL_LOG
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DLOG_LEVEL=2

custom_i18n_builtin_langs = en

lib_deps =
    ${base.lib_deps}
    zinggjm/GxEPD2@^1.6.9
